<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon panier | Gaye Parfumerie</title>

    <meta
        name="description"
        content="Votre panier Gaye Parfumerie"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =====================================================
           PAGE PANIER
           ===================================================== */

        .cart-page {

            min-height: 100vh;

            padding:
                150px 5%
                100px;

            background: #f6f2ea;

            color: #0b0b0b;

        }


        .cart-header {

            width: min(100%, 1240px);

            margin: 0 auto 50px;

        }


        .cart-header span {

            color: #c9a45c;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 4px;

        }


        .cart-header h1 {

            margin-top: 10px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: clamp(55px, 7vw, 85px);

            font-weight: 400;

            line-height: 0.9;

        }


        .cart-layout {

            width: min(100%, 1240px);

            margin: auto;

            display: grid;

            grid-template-columns:
                1fr 360px;

            gap: 35px;

            align-items: start;

        }


        /* =====================================================
           PRODUITS
           ===================================================== */

        .cart-products {

            background: white;

            padding: 25px;

        }


        .cart-item {

            min-height: 125px;

            padding: 20px 0;

            display: grid;

            grid-template-columns:
                90px
                1fr
                auto
                auto
                30px;

            gap: 20px;

            align-items: center;

            border-bottom:
                1px solid #eeeeee;

        }


        .cart-item:first-child {

            padding-top: 5px;

        }


        .cart-item-image {

            width: 90px;

            height: 110px;

            overflow: hidden;

            background: #eee;

        }


        .cart-item-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .cart-item-info span {

            color: #b0b0b0;

            font-size: 8px;

            font-weight: 600;

            letter-spacing: 2px;

        }


        .cart-item-info h3 {

            margin: 5px 0;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 25px;

            font-weight: 600;

        }


        .cart-item-info p {

            color: #777;

            font-size: 11px;

        }


        /* =====================================================
           QUANTITÉ
           ===================================================== */

        .cart-quantity {

            display: flex;

            align-items: center;

            border:
                1px solid #dddddd;

        }


        .cart-quantity button {

            width: 32px;

            height: 35px;

            border: none;

            background: transparent;

            font-size: 18px;

        }


        .cart-quantity strong {

            width: 30px;

            text-align: center;

            font-size: 11px;

        }


        .cart-item-total {

            min-width: 90px;

            text-align: right;

            font-size: 12px;

            font-weight: 700;

        }


        .remove-cart {

            width: 30px;

            height: 30px;

            border: none;

            background: transparent;

            color: #999;

            font-size: 25px;

        }


        .remove-cart:hover {

            color: #b00020;

        }


        /* =====================================================
           RÉSUMÉ
           ===================================================== */

        .cart-summary {

            position: sticky;

            top: 105px;

            padding: 30px;

            background: #0b0b0b;

            color: white;

        }


        .cart-summary h2 {

            margin-bottom: 30px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 35px;

            font-weight: 400;

        }


        .summary-line {

            padding: 14px 0;

            display: flex;

            justify-content: space-between;

            border-bottom:
                1px solid
                rgba(255,255,255,0.1);

            color: #aaa;

            font-size: 11px;

        }


        .summary-line strong {

            color: white;

        }


        .summary-total {

            padding-top: 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .summary-total span {

            color: #aaa;

            font-size: 10px;

            letter-spacing: 1px;

        }


        .summary-total strong {

            color: #c9a45c;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 32px;

            font-weight: 600;

        }


        .checkout-btn {

            width: 100%;

            height: 55px;

            margin-top: 25px;

            border: none;

            background: #c9a45c;

            color: #0b0b0b;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1px;

            transition: 0.3s ease;

        }


        .checkout-btn:hover {

            background: #e2c98d;

            transform: translateY(-2px);

        }


        .continue-shopping {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: #999;

            font-size: 10px;

        }


        .continue-shopping:hover {

            color: #c9a45c;

        }


        /* =====================================================
           PANIER VIDE
           ===================================================== */

        .cart-empty {

            padding: 90px 30px;

            text-align: center;

        }


        .cart-empty-icon {

            margin-bottom: 20px;

            font-size: 50px;

        }


        .cart-empty h2 {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 40px;

            font-weight: 500;

        }


        .cart-empty p {

            max-width: 450px;

            margin: 10px auto 30px;

            color: #777;

            font-size: 12px;

        }


        /* =====================================================
           NOTIFICATION
           ===================================================== */

        .cart-notification {

            position: fixed;

            top: 100px;

            right: 25px;

            z-index: 5000;

            padding: 16px 22px;

            background: #0b0b0b;

            color: white;

            border-left:
                3px solid #c9a45c;

            font-size: 11px;

            opacity: 0;

            transform:
                translateX(30px);

            transition: 0.3s ease;

        }


        .cart-notification.show {

            opacity: 1;

            transform:
                translateX(0);

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 850px) {

            .cart-layout {

                grid-template-columns: 1fr;

            }


            .cart-summary {

                position: static;

            }

        }


        @media (max-width: 600px) {

            .cart-page {

                padding:
                    120px 5%
                    70px;

            }


            .cart-products {

                padding: 15px;

            }


            .cart-item {

                grid-template-columns:
                    75px
                    1fr
                    30px;

                gap: 12px;

            }


            .cart-item-image {

                width: 75px;

                height: 95px;

            }


            .cart-quantity {

                grid-column: 2;

                width: max-content;

            }


            .cart-item-total {

                grid-column: 2;

                text-align: left;

            }


            .remove-cart {

                grid-column: 3;

                grid-row: 1;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <div class="header-container">

            <a href="index.html" class="logo">

                <span class="logo-main">
                    GAYE
                </span>

                <span class="logo-sub">
                    PARFUMERIE
                </span>

            </a>


            <nav class="nav-menu">

                <a href="index.html">
                    Accueil
                </a>

                <a href="boutique.html">
                    Boutique
                </a>

                <a href="a-propos.html">
                    À propos
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </nav>


            <div class="header-actions">

                <a
                    href="panier.html"
                    class="cart-btn"
                >

                    <span class="cart-icon">
                        🛍
                    </span>

                    <span class="cart-count">
                        0
                    </span>

                </a>


                <button
                    class="menu-btn"
                    aria-label="Menu"
                >
                    ☰
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================================
         CONTENU
         ===================================================== -->

    <main class="cart-page">


        <div class="cart-header">

            <span>
                VOTRE SÉLECTION
            </span>

            <h1>
                Mon panier
            </h1>

        </div>


        <div class="cart-layout">


            <!-- PRODUITS -->

            <div class="cart-products">

                <!-- Les produits seront ajoutés automatiquement
                     par panier.js -->

            </div>


            <!-- RÉSUMÉ -->

            <aside class="cart-summary">

                <h2>
                    Résumé
                </h2>


                <div class="summary-line">

                    <span>
                        Sous-total
                    </span>

                    <strong class="cart-subtotal">
                        0 FCFA
                    </strong>

                </div>


                <div class="summary-line">

                    <span>
                        Livraison
                    </span>

                    <strong>
                        À confirmer
                    </strong>

                </div>


                <div class="summary-total">

                    <span>
                        TOTAL
                    </span>

                    <strong class="cart-total">
                        0 FCFA
                    </strong>

                </div>


                <button
                    class="checkout-btn"
                    onclick="window.location.href='commande.html'"
                >
                    PASSER LA COMMANDE
                </button>


                <a
                    href="boutique.html"
                    class="continue-shopping"
                >
                    ← Continuer mes achats
                </a>

            </aside>


        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/produits.js"></script>

    <script src="js/panier.js"></script>

    <script src="js/app.js"></script>


</body>

</html>
