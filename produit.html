<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produit | Gaye Parfumerie</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================
           PAGE PRODUIT
           ========================= */

        .product-page {
            min-height: 100vh;
            padding: 150px 6% 90px;
            background: var(--cream);
        }

        .product-container {
            max-width: 1150px;
            margin: auto;
        }

        .back-shop {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #555;
            text-decoration: none;
            font-size: 12px;
            margin-bottom: 35px;
            transition: 0.3s;
        }

        .back-shop:hover {
            color: var(--gold);
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            min-height: 650px;
        }

        /* IMAGE */

        .product-detail-image {
            position: relative;
            min-height: 650px;
            background: #eee;
            overflow: hidden;
        }

        .product-detail-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-detail-category {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--black);
            color: white;
            padding: 9px 15px;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* INFORMATIONS */

        .product-detail-info {
            padding: 70px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-detail-brand {
            color: var(--gold);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 4px;
            margin-bottom: 18px;
        }

        .product-detail-info h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(48px, 5vw, 70px);
            font-weight: 500;
            line-height: 0.95;
            color: var(--black);
            margin-bottom: 25px;
        }

        .product-detail-price {
            font-size: 20px;
            font-weight: 600;
            color: var(--black);
            margin-bottom: 25px;
        }

        .product-detail-description {
            color: #666;
            line-height: 1.9;
            font-size: 13px;
            max-width: 480px;
            margin-bottom: 35px;
        }

        .product-separator {
            width: 60px;
            height: 1px;
            background: var(--gold);
            margin-bottom: 30px;
        }

        /* QUANTITE */

        .quantity-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            width: max-content;
            border: 1px solid #ddd;
            margin-bottom: 25px;
        }

        .quantity-selector button {
            width: 42px;
            height: 42px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }

        .quantity-selector button:hover {
            background: #f2f2f2;
        }

        .quantity-selector span {
            width: 45px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
        }

        /* BOUTONS */

        .product-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .product-add-cart {
            border: none;
            background: var(--black);
            color: white;
            padding: 17px 30px;
            cursor: pointer;
            font-family: "Montserrat", sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .product-add-cart:hover {
            background: var(--gold);
            color: var(--black);
        }

        .product-buy-now {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--black);
            color: var(--black);
            padding: 16px 28px;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .product-buy-now:hover {
            background: var(--black);
            color: white;
        }

        /* MESSAGE */

        .product-message {
            margin-top: 20px;
            color: #777;
            font-size: 12px;
            min-height: 18px;
        }

        /* PRODUIT INEXISTANT */

        .product-not-found {
            max-width: 700px;
            margin: auto;
            text-align: center;
            padding: 100px 20px;
        }

        .product-not-found h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: 50px;
            margin-bottom: 15px;
        }

        .product-not-found p {
            color: #777;
            margin-bottom: 30px;
        }

        /* RESPONSIVE */

        @media (max-width: 850px) {

            .product-page {
                padding: 120px 5% 60px;
            }

            .product-detail {
                grid-template-columns: 1fr;
            }

            .product-detail-image {
                min-height: 500px;
            }

            .product-detail-info {
                padding: 50px 35px;
            }
        }

        @media (max-width: 500px) {

            .product-detail-image {
                min-height: 400px;
            }

            .product-detail-info {
                padding: 40px 25px;
            }

            .product-detail-info h1 {
                font-size: 48px;
            }

            .product-actions {
                flex-direction: column;
            }

            .product-add-cart,
            .product-buy-now {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header class="header">

        <div class="logo">
            <span>GAYE</span>
            <small>PARFUMERIE</small>
        </div>

        <nav class="nav-menu">

            <a href="index.html">
                Accueil
            </a>

            <a href="boutique.html">
                Boutique
            </a>

            <a href="a-propos.html">
                À propos
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

        <div class="header-actions">

            <button class="search-btn">
                ⌕
            </button>

            <a href="panier.html" class="cart-btn">
                🛍
                <span class="cart-count">0</span>
            </a>

            <button class="menu-btn">
                ☰
            </button>

        </div>

    </header>


    <!-- =========================
         PRODUIT
         ========================= -->

    <main class="product-page">

        <div class="product-container">

            <a href="boutique.html" class="back-shop">
                ← Retour à la boutique
            </a>

            <div id="product-content"></div>

        </div>

    </main>


    <!-- =========================
         SCRIPTS
         ========================= -->

    <script src="js/produits.js"></script>
    <script src="js/panier.js"></script>
    <script src="js/app.js"></script>


    <script>

        const contenuProduit =
            document.getElementById("product-content");


        /* =========================
           RECUPERER L'ID
           ========================= */

        const parametres =
            new URLSearchParams(window.location.search);

        const idProduit =
            Number(parametres.get("id"));


        /* =========================
           CHERCHER LE PRODUIT
           ========================= */

        const produit =
            produits.find(function (article) {

                return article.id === idProduit;

            });


        /* =========================
           SI PRODUIT INEXISTANT
           ========================= */

        if (!produit) {

            contenuProduit.innerHTML = `

                <div class="product-not-found">

                    <h1>
                        Produit introuvable
                    </h1>

                    <p>
                        Désolé, ce parfum n'existe pas
                        dans notre collection.
                    </p>

                    <a
                        href="boutique.html"
                        class="btn btn-primary">
                        Retour à la boutique
                    </a>

                </div>

            `;

        } else {

            /* =========================
               CATEGORIE
               ========================= */

            const categorie =
                produit.categorie.charAt(0).toUpperCase() +
                produit.categorie.slice(1);


            /* =========================
               AFFICHAGE
               ========================= */

            contenuProduit.innerHTML = `

                <section class="product-detail">

                    <div class="product-detail-image">

                        <img
                            src="${produit.image}"
                            alt="${produit.nom}"
                        >

                        <span class="product-detail-category">
                            ${categorie}
                        </span>

                    </div>


                    <div class="product-detail-info">

                        <div class="product-detail-brand">
                            GAYE PARFUMERIE
                        </div>

                        <h1>
                            ${produit.nom}
                        </h1>

                        <div class="product-detail-price">
                            ${produit.prix.toLocaleString("fr-FR")} FCFA
                        </div>

                        <div class="product-separator"></div>

                        <p class="product-detail-description">
                            ${produit.description}
                        </p>


                        <div class="quantity-title">
                            Quantité
                        </div>


                        <div class="quantity-selector">

                            <button
                                id="quantity-minus">
                                −
                            </button>

                            <span id="quantity">
                                1
                            </span>

                            <button
                                id="quantity-plus">
                                +
                            </button>

                        </div>


                        <div class="product-actions">

                            <button
                                class="product-add-cart"
                                id="add-product-cart">

                                Ajouter au panier

                            </button>

                            <a
                                href="panier.html"
                                class="product-buy-now">

                                Voir le panier

                            </a>

                        </div>


                        <div
                            class="product-message"
                            id="product-message">
                        </div>

                    </div>

                </section>

            `;


            /* =========================
               QUANTITE
               ========================= */

            let quantite = 1;


            const elementQuantite =
                document.getElementById("quantity");


            document
                .getElementById("quantity-plus")
                .addEventListener(
                    "click",
                    function () {

                        quantite++;

                        elementQuantite.textContent =
                            quantite;

                    }
                );


            document
                .getElementById("quantity-minus")
                .addEventListener(
                    "click",
                    function () {

                        if (quantite > 1) {

                            quantite--;

                            elementQuantite.textContent =
                                quantite;

                        }

                    }
                );


            /* =========================
               AJOUT AU PANIER
               ========================= */

            document
                .getElementById("add-product-cart")
                .addEventListener(
                    "click",
                    function () {

                        for (
                            let i = 0;
                            i < quantite;
                            i++
                        ) {

                            ajouterAuPanier(
                                produit.id
                            );

                        }


                        document
                            .getElementById("product-message")
                            .textContent =
                            "✓ Produit ajouté au panier.";

                    }
                );

        }

    </script>

</body>

</html>
